spring:
  application:
    name: betterhalf-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/betterhalf}
    username: ${DATABASE_USER:betterhalf}
    password: ${DATABASE_PASSWORD:betterhalf}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

logging:
  level:
    root: INFO
    com.betterhalf: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] [%X{userId}] [%X{coupleId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

betterhalf:
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-production-use-256-bit-key-minimum-32-characters}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}

  media:
    storage:
      type: ${STORAGE_TYPE:s3}
      bucket: ${STORAGE_BUCKET:betterhalf-media}
      region: ${STORAGE_REGION:us-east-1}
      access-key-id: ${STORAGE_ACCESS_KEY_ID:}
      secret-access-key: ${STORAGE_SECRET_ACCESS_KEY:}
      signed-url-ttl: ${SIGNED_URL_TTL:PT1H}
    upload:
      max-file-size: 104857600
      allowed-image-types: image/jpeg,image/png,image/webp,image/gif
      allowed-video-types: video/mp4,video/webm

  rate-limit:
    enabled: true
    per-ip: 100
    per-user: 1000
    per-couple: 2000
    window-seconds: 60

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
